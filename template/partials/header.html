<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.title}}</title>
<meta name="description" content="{{page.metaDescription}}">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
{{#if sample.isUnpaidSample}}
<div class="sample-banner">{{sample.noticeText}}</div>
{{/if}}
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="index.html">{{business.logoText}}</a>
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="siteNav" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" id="siteNav">
      <ul>
        {{#each nav}}
        <li><a href="{{this.href}}">{{this.label}}</a></li>
        {{/each}}
      </ul>
      <a class="btn btn-whatsapp nav-whatsapp" target="_blank" rel="noopener" href="https://wa.me/{{business.whatsappNumber}}?text={{business.whatsappDefaultMessageEncoded}}">
        WhatsApp Us
      </a>
    </nav>
  </div>
</header>
<main id="main">
